plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minekz" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// a local dedicated server for ticket 09 checks; its own folder so it doesn't share worlds with runClient
		server {
			runDir "run-server"
		}
		// a fixed name, so the host keeps one UUID (and one player's progress) across launches
		client {
			programArgs "--username", "Player1"
		}
		// a second game for LAN tests, with its own folder and name so it doesn't clash with runClient
		client2 {
			client()
			name "Minecraft Client 2"
			runDir "run2"
			programArgs "--username", "Player2"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':engine')
	include project(':engine')

	// Offline speech recognition. 0.3.38, not 0.3.45: the 0.3.45 binding needs a native function the macOS libs lack. include() nests the jars (and Vosk's bundled native libraries) in the mod jar.
	implementation 'com.alphacephei:vosk:0.3.38'
	include 'com.alphacephei:vosk:0.3.38'
	include 'net.java.dev.jna:jna:5.13.0'
}

// The Vosk model is packed inside the mod as a zip and unpacked to the game dir on first use (Vosk needs real files).
// Source is the ticket 01 prototype cache (gitignored): download vosk-model-small-kz-0.42 there before building.
def modelDir = file('prototypes/vosk-piper-PROTOTYPE/cache/vosk-model-small-kz-0.42')
def modelZip = tasks.register('modelZip', Zip) {
	from modelDir
	doFirst {
		if (!new File(modelDir, 'conf').isDirectory()) {
			throw new GradleException('Vosk model missing: put vosk-model-small-kz-0.42 in prototypes/vosk-piper-PROTOTYPE/cache/')
		}
	}
	archiveFileName = 'vosk-model-small-kz-0.42.zip'
	destinationDirectory = layout.buildDirectory.dir('model')
}
tasks.named('processClientResources') {
	from(modelZip)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
